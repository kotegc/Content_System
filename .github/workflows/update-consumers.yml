name: Propagate content-system updates to consumer repos

on:
  push:
    branches: [main]
    paths:
      - '06_Code/tokens/brands/compiled/**'
      - '06_Code/assets/**'
      - '06_Code/components/**'
  workflow_dispatch:

jobs:
  update-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - { repo: "kotegc/My_Portfolio",  submodule: "06_Code/system", favicon_dest: "06_Code/My_Portfolio/astro/public/favicon.svg" }
          - { repo: "kotegc/Publisher",      submodule: "06_Code/system", favicon_dest: "" }
          - { repo: "kotegc/Paralia",        submodule: "06_Code/content-system", favicon_dest: "" }
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kotegc

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: false

      - name: Update submodule and open PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git submodule init ${{ matrix.consumer.submodule }}
          git submodule update --remote ${{ matrix.consumer.submodule }}
          git add ${{ matrix.consumer.submodule }}
          if [ -n "${{ matrix.consumer.favicon_dest }}" ]; then
            cp "${{ matrix.consumer.submodule }}/06_Code/assets/brands/personal/icons/favicon.svg" \
               "${{ matrix.consumer.favicon_dest }}" 2>/dev/null || true
            git add "${{ matrix.consumer.favicon_dest }}"
          fi
          git diff --staged --quiet && echo "No changes, skipping PR" && exit 0
          BRANCH="chore/update-content-system-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update Content System submodule"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update Content System submodule" \
            --body "Content System updated. Review changes in \`06_Code/tokens/brands/compiled/\`, \`06_Code/assets/\`, and \`06_Code/components/\` before merging." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
